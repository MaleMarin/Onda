<!-- Wix: Ajustes HTML → Código. Pega TODO (div + iframe + script). Proyecto: onda2026.vercel.app -->

<div style="width:100%;max-width:min(720px,92vw);margin:0 auto;padding:24px 20px;background:#d2d6dc;border-radius:28px;overflow:hidden;box-shadow:22px 22px 44px rgba(100,105,115,0.8), -22px -22px 44px rgba(255,255,255,0.99);">
  <iframe
    id="onda-bot"
    src="https://onda2026.vercel.app/chat?embed=1"
    width="100%"
    scrolling="no"
    allow="autoplay; microphone; clipboard-read; clipboard-write"
    style="border:0;display:block;min-height:820px;"
    title="Chat ONDA - Fundación Precisar"
  ></iframe>
</div>
<script>
  (function() {
    var iframe = document.getElementById('onda-bot');
    if (!iframe) return;
    function onMessage(e) {
      if (e.data && typeof e.data.height === 'number' && e.data.height > 0) {
        iframe.style.height = e.data.height + 'px';
      }
    }
    window.addEventListener('message', onMessage);
  })();
</script>
