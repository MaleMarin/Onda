<!-- Wix: Ajustes HTML → Código. Pega TODO (div + iframe + script). -->
<!-- El bot envía su altura por postMessage; el script redimensiona el iframe. Fondo transparente. -->
<!-- Si Wix no permite <script>, usa solo el div+iframe y pon en el div: style="...;height:1000px;" -->

<div style="width:100%;background:transparent;">
  <iframe
    id="onda-bot"
    src="https://onda-git-main-precisar.vercel.app/chat?embed=1"
    width="100%"
    scrolling="no"
    style="border:0;display:block;background:transparent;min-height:560px;"
    title="Chat ONDA - Fundación Precisar"
  ></iframe>
</div>
<script>
  (function() {
    var iframe = document.getElementById('onda-bot');
    if (!iframe) return;
    function onMessage(e) {
      if (e.data && typeof e.data.height === 'number' && e.data.height > 0) {
        iframe.style.height = e.data.height + 'px';
      }
    }
    window.addEventListener('message', onMessage);
  })();
</script>
