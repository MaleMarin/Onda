<!-- Pegar en Wix: Ajustes HTML → Código -->
<!-- El bot incluye ya el mismo fondo y estilo que en local (fondo #d2d6dc, neumorfismo). -->
<!-- Este contenedor opcional añade un marco con sombra para integrar en la página Wix. -->

<!-- Fondo gris #d2d6dc para que el neumorfismo brille. -->
<div style="
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 20px;
  background: #d2d6dc;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 22px 22px 44px rgba(100,105,115,0.8), -22px -22px 44px rgba(255,255,255,0.99);
">
  <iframe
    id="onda-bot"
    src="https://onda-git-main-precisar.vercel.app/chat?embed=1"
    width="100%"
    height="700"
    scrolling="no"
    frameborder="0"
    title="Chat ONDA - Fundación Precisar"
    style="display:block;border:none;min-height:600px;border-radius:28px;"
  ></iframe>
</div>
<script>
  (function() {
    var iframe = document.getElementById('onda-bot');
    if (!iframe) return;
    window.addEventListener('message', function(e) {
      if (e.data && typeof e.data.height === 'number' && e.data.height > 0) {
        iframe.style.height = e.data.height + 'px';
      }
    });
  })();
</script>
