# Evaluaciones completas (~75 casos). Requiere OPENAI_API_KEY (u orquestador configurado en evals).
# No corre en cada push: manual o semanal. Evita llamadas diarias innecesarias a API de IA.

name: Evals full

on:
  workflow_dispatch:
  schedule:
    # Una vez por semana: martes 09:00 UTC; la ejecución usa API de IA y puede generar costos.
    - cron: "0 9 * * 2"

jobs:
  evals-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Evals deterministas (dataset completo)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALS_MODE: deterministic
        run: npm run evals

      - name: Subir informe completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-full-latest
          path: |
            artifacts/evals/latest.json
            artifacts/evals/latest.md
            artifacts/evals/history/
          if-no-files-found: ignore
