# CI para Onda (ondabot): raíz del repo, Next.js + TypeScript + Vitest.
# No usar working-directory de otro proyecto (p. ej. mi-politica-digital).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita que un push nuevo marque el anterior como "cancelled" (check rojo confuso).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Versiones
        run: node -v && npm -v

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
