<div style="width:100%;max-width:560px;margin:0 auto;padding:24px 20px;background:#d2d6dc;border-radius:28px;overflow:hidden;box-shadow:22px 22px 44px rgba(100,105,115,0.8), -22px -22px 44px rgba(255,255,255,0.99);">
  <iframe
    id="onda-bot"
    src="https://onda2026.vercel.app/chat?embed=1"
    width="100%"
    height="700"
    scrolling="no"
    frameborder="0"
    title="Chat ONDA - Fundación Precisar"
    allow="autoplay; microphone; clipboard-read; clipboard-write"
    style="display:block;border:none;min-height:820px;"
  ></iframe>
</div>
<script>
  (function(){
    var f = document.getElementById('onda-bot');
    if (!f) return;
    window.addEventListener('message', function(e) {
      if (e.data && typeof e.data.height === 'number' && e.data.height > 0)
        f.style.height = e.data.height + 'px';
    });
  })();
</script>
